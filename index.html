<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fancy Sorting Visualizer</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #003366;
    }
    #arrayContainer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 400px;
      margin: 30px auto;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      border-radius: 10px;
      overflow: hidden;
      width: 90%;
    }
    .bar {
      margin: 0 2px;
      background-color: #3498db;
      width: 20px;
      border-radius: 5px 5px 0 0;
      transition: all 0.3s ease;
    }
    #controls {
      margin-top: 20px;
    }
    button {
      background-color: #3498db;
      border: none;
      color: white;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #2c80b4;
    }
    input[type=range], input[type=number] {
      margin-top: 10px;
    }
    #metrics {
      margin-top: 20px;
      font-weight: bold;
      color: #003366;
    }
  </style>
</head>
<body>

  <h1>Fancy Sorting Visualizer</h1>

  <div id="arrayContainer"></div>

  <div id="controls">
    <input type="number" id="arraySize" min="5" max="50" value="20">
    <button id="generateArrayBtn">Generate Array</button>
    <button onclick="startSorting('bubble')">Bubble Sort</button>
    <button onclick="startSorting('selection')">Selection Sort</button>
    <button onclick="startSorting('insertion')">Insertion Sort</button>
    <button onclick="startSorting('merge')">Merge Sort</button>
    <button onclick="startSorting('quick')">Quick Sort</button><br>
    <button id="pauseBtn">Pause</button>
    <button id="resumeBtn">Resume</button>
    <button id="muteBtn">Mute Sound</button><br>
    <input type="range" id="speedControl" min="1" max="1000" value="500">
    <label>Speed</label>
  </div>

  <div id="metrics">
    <div id="comparisons">Comparisons: 0</div>
    <div id="swaps">Swaps: 0</div>
    <div id="executionTime">Execution Time: 0s</div>
  </div>

  <audio id="sortSound" src="https://www.soundjay.com/button/sounds/button-3.mp3" loop></audio>

<script>
  let array = [];
  let isPaused = false;
  let speed = 500;
  let comparisons = 0;
  let swaps = 0;
  let executionTime = 0;

  const arrayContainer = document.getElementById('arrayContainer');
  const comparisonsDisplay = document.getElementById('comparisons');
  const swapsDisplay = document.getElementById('swaps');
  const executionTimeDisplay = document.getElementById('executionTime');
  const sortSound = document.getElementById('sortSound');
  const speedControl = document.getElementById('speedControl');

  speedControl.addEventListener('input', (e) => {
    speed = 1000 - e.target.value;
  });

  function generateRandomArray(size) {
    array = Array.from({length: size}, () => Math.floor(Math.random() * 100) + 1);
    renderArray();
  }

  function renderArray(activeIndices = []) {
    arrayContainer.innerHTML = '';
    array.forEach((value, idx) => {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = `${value * 3}px`;
      if (activeIndices.includes(idx)) {
        bar.style.backgroundColor = '#e74c3c'; // Highlight
      }
      arrayContainer.appendChild(bar);
    });
  }

  async function wait() {
    renderMetrics();
    return new Promise(resolve => {
      let interval = setInterval(() => {
        if (!isPaused) {
          clearInterval(interval);
          resolve();
        }
      }, speed);
    });
  }

  async function bubbleSort() {
    let startTime = Date.now();
    for (let i = 0; i < array.length; i++) {
      for (let j = 0; j < array.length - i - 1; j++) {
        comparisons++;
        renderArray([j, j+1]);
        await wait();
        if (array[j] > array[j+1]) {
          swaps++;
          [array[j], array[j+1]] = [array[j+1], array[j]];
          renderArray([j, j+1]);
          await wait();
        }
      }
    }
    showExecutionTime(startTime);
  }

  async function selectionSort() {
    let startTime = Date.now();
    for (let i = 0; i < array.length; i++) {
      let minIdx = i;
      for (let j = i+1; j < array.length; j++) {
        comparisons++;
        renderArray([j, minIdx]);
        await wait();
        if (array[j] < array[minIdx]) {
          minIdx = j;
        }
      }
      if (minIdx !== i) {
        swaps++;
        [array[i], array[minIdx]] = [array[minIdx], array[i]];
        renderArray([i, minIdx]);
        await wait();
      }
    }
    showExecutionTime(startTime);
  }

  async function insertionSort() {
    let startTime = Date.now();
    for (let i = 1; i < array.length; i++) {
      let key = array[i];
      let j = i-1;
      while (j >= 0 && array[j] > key) {
        comparisons++;
        array[j+1] = array[j];
        j--;
        renderArray([j, j+1]);
        await wait();
      }
      array[j+1] = key;
      renderArray([j+1]);
      swaps++;
      await wait();
    }
    showExecutionTime(startTime);
  }

  async function mergeSort(arr = array, l = 0, r = array.length - 1) {
    if (l >= r) return;
    const mid = Math.floor((l + r) / 2);
    await mergeSort(arr, l, mid);
    await mergeSort(arr, mid+1, r);
    await merge(arr, l, mid, r);
  }

  async function merge(arr, l, mid, r) {
    let n1 = mid - l + 1;
    let n2 = r - mid;
    let L = [], R = [];
    for (let i = 0; i < n1; i++) L.push(arr[l+i]);
    for (let i = 0; i < n2; i++) R.push(arr[mid+1+i]);
    let i = 0, j = 0, k = l;
    while (i < n1 && j < n2) {
      comparisons++;
      if (L[i] <= R[j]) {
        arr[k++] = L[i++];
      } else {
        arr[k++] = R[j++];
      }
      renderArray([k-1]);
      await wait();
    }
    while (i < n1) {
      arr[k++] = L[i++];
      renderArray([k-1]);
      await wait();
    }
    while (j < n2) {
      arr[k++] = R[j++];
      renderArray([k-1]);
      await wait();
    }
  }

  async function quickSort(low = 0, high = array.length-1) {
    if (low < high) {
      let pi = await partition(low, high);
      await quickSort(low, pi-1);
      await quickSort(pi+1, high);
    }
  }

  async function partition(low, high) {
    let pivot = array[high];
    let i = low-1;
    for (let j = low; j < high; j++) {
      comparisons++;
      renderArray([j, high]);
      await wait();
      if (array[j] < pivot) {
        i++;
        swaps++;
        [array[i], array[j]] = [array[j], array[i]];
        renderArray([i, j]);
        await wait();
      }
    }
    swaps++;
    [array[i+1], array[high]] = [array[high], array[i+1]];
    renderArray([i+1, high]);
    await wait();
    return i+1;
  }

  async function startSorting(type) {
    resetMetrics();
    sortSound.play();
    let startTime = Date.now();
    if (type === 'bubble') await bubbleSort();
    else if (type === 'selection') await selectionSort();
    else if (type === 'insertion') await insertionSort();
    else if (type === 'merge') await mergeSort();
    else if (type === 'quick') await quickSort();
    showExecutionTime(startTime);
    stopSound();
  }

  function resetMetrics() {
    comparisons = 0;
    swaps = 0;
    executionTime = 0;
    comparisonsDisplay.innerText = 'Comparisons: 0';
    swapsDisplay.innerText = 'Swaps: 0';
    executionTimeDisplay.innerText = 'Execution Time: 0s';
  }

  function renderMetrics() {
    comparisonsDisplay.innerText = `Comparisons: ${comparisons}`;
    swapsDisplay.innerText = `Swaps: ${swaps}`;
  }

  function showExecutionTime(startTime) {
    executionTime = (Date.now() - startTime) / 1000;
    executionTimeDisplay.innerText = `Execution Time: ${executionTime.toFixed(2)}s`;
  }

  function stopSound() {
    sortSound.pause();
    sortSound.currentTime = 0;
  }

  document.getElementById('generateArrayBtn').addEventListener('click', () => {
    const size = parseInt(document.getElementById('arraySize').value);
    generateRandomArray(size);
  });

  document.getElementById('pauseBtn').addEventListener('click', () => { isPaused = true; });
  document.getElementById('resumeBtn').addEventListener('click', () => { isPaused = false; });
  document.getElementById('muteBtn').addEventListener('click', () => { sortSound.muted = !sortSound.muted; });

  window.onload = () => {
    generateRandomArray(20);
  };
</script>

</body>
</html>
